<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "Yu Gothic", sans-serif; fill: #111827; }
    .title { font-size: 22px; font-weight: 600; }
    .section { font-size: 17px; font-weight: 600; }
    .label { font-size: 14px; }
    .small { font-size: 12px; fill: #4b5563; }
    .wire { fill: none; stroke: #111827; stroke-width: 3; stroke-linecap: round; }
    .guide { fill: none; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .node { fill: #111827; }
    .slot { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 8; }
  </style>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text class="title" x="48" y="42">BP Fig. 1.2 → repository indices</text>
  <text class="small" x="48" y="66">Derived annotation. The cited source image remains BP97, PDF p.16 (printed p.7).</text>

  <rect class="panel" x="40" y="92" width="1120" height="270"/>
  <text class="section" x="500" y="124">Vertex replacement</text>
  <text class="small" x="500" y="147">Marked node j lies at PD slot j; crossings without dots are fake.</text>

  <!-- Four disjoint trivalent marked nodes. Intersections of paths below have
       no dot and therefore do not connect, exactly as in BP's convention. -->
  <g>
    <path class="wire" d="M 200 224 L 150 224 M 200 224 L 200 125 M 200 224 L 200 324"/>
    <path class="wire" d="M 270 174 L 270 125 M 270 174 L 150 174 M 270 174 L 390 174"/>
    <path class="wire" d="M 340 224 L 390 224 M 340 224 L 340 125 M 340 224 L 340 324"/>
    <path class="wire" d="M 270 274 L 270 324 M 270 274 L 150 274 M 270 274 L 390 274"/>

    <circle class="node" cx="200" cy="224" r="7"/>
    <circle class="node" cx="270" cy="274" r="7"/>
    <circle class="node" cx="340" cy="224" r="7"/>
    <circle class="node" cx="270" cy="174" r="7"/>

    <circle class="slot" cx="120" cy="224" r="17"/><text class="label" x="120" y="229" text-anchor="middle">1</text>
    <circle class="slot" cx="270" cy="348" r="17"/><text class="label" x="270" y="353" text-anchor="middle">2</text>
    <circle class="slot" cx="420" cy="224" r="17"/><text class="label" x="420" y="229" text-anchor="middle">3</text>
    <circle class="slot" cx="270" cy="101" r="17"/><text class="label" x="270" y="106" text-anchor="middle">4</text>

    <text class="label" x="174" y="217">j=1</text>
    <text class="label" x="278" y="296">j=2</text>
    <text class="label" x="348" y="217">j=3</text>
    <text class="label" x="278" y="194">j=4</text>
  </g>

  <g transform="translate(500 170)">
    <text class="label" x="0" y="0">Lane order follows increasing counter-clockwise slot number</text>
    <text class="label" x="0" y="34">Q₁ = (4,1,2)</text>
    <text class="label" x="0" y="62">Q₂ = (1,2,3)</text>
    <text class="label" x="0" y="90">Q₃ = (2,3,4)</text>
    <text class="label" x="0" y="118">Q₄ = (3,4,1)</text>
    <text class="small" x="0" y="158">Each Qₛ lists the three marked vertices reached from slot s.</text>
    <text class="small" x="0" y="180">Qₛ = (s−1,s,s+1), with indices modulo 4.</text>
  </g>

  <rect class="panel" x="40" y="386" width="1120" height="286"/>
  <text class="section" x="68" y="420">Four edge panels, normalized tail (bottom) → head (top)</text>
  <text class="small" x="68" y="443">At every panel: source lanes appear on screen as 3,2,1; target lanes as 1,2,3.</text>

  <g transform="translate(145 470)">
    <text class="label" x="60" y="0" text-anchor="middle">over → over</text>
    <text class="small" x="60" y="20" text-anchor="middle">same</text>
    <text class="small" x="10" y="45" text-anchor="middle">R1</text><text class="small" x="60" y="45" text-anchor="middle">R2</text><text class="small" x="110" y="45" text-anchor="middle">R3</text>
    <line class="wire" x1="10" y1="55" x2="10" y2="165"/><line class="wire" x1="60" y1="55" x2="60" y2="165"/><line class="wire" x1="110" y1="55" x2="110" y2="165"/>
    <text class="small" x="10" y="190" text-anchor="middle">L3</text><text class="small" x="60" y="190" text-anchor="middle">L2</text><text class="small" x="110" y="190" text-anchor="middle">L1</text>
    <text class="small" x="60" y="220" text-anchor="middle">1→3, 2→2, 3→1</text>
  </g>

  <g transform="translate(405 470)">
    <text class="label" x="60" y="0" text-anchor="middle">under → under</text>
    <text class="small" x="60" y="20" text-anchor="middle">same</text>
    <text class="small" x="10" y="45" text-anchor="middle">R1</text><text class="small" x="60" y="45" text-anchor="middle">R2</text><text class="small" x="110" y="45" text-anchor="middle">R3</text>
    <line class="wire" x1="10" y1="55" x2="10" y2="165"/><line class="wire" x1="60" y1="55" x2="60" y2="165"/><line class="wire" x1="110" y1="55" x2="110" y2="165"/>
    <text class="small" x="10" y="190" text-anchor="middle">L3</text><text class="small" x="60" y="190" text-anchor="middle">L2</text><text class="small" x="110" y="190" text-anchor="middle">L1</text>
    <text class="small" x="60" y="220" text-anchor="middle">1→3, 2→2, 3→1</text>
  </g>

  <g transform="translate(665 470)">
    <text class="label" x="60" y="0" text-anchor="middle">under → over</text>
    <text class="small" x="60" y="20" text-anchor="middle">mixed</text>
    <text class="small" x="10" y="45" text-anchor="middle">R1</text><text class="small" x="60" y="45" text-anchor="middle">R2</text><text class="small" x="110" y="45" text-anchor="middle">R3</text>
    <path class="wire" d="M 10 165 L 10 55 M 60 165 C 62 120 105 100 110 55 M 110 165 C 108 120 65 100 60 55"/>
    <text class="small" x="10" y="190" text-anchor="middle">L3</text><text class="small" x="60" y="190" text-anchor="middle">L2</text><text class="small" x="110" y="190" text-anchor="middle">L1</text>
    <text class="small" x="60" y="220" text-anchor="middle">1→2, 2→3, 3→1</text>
  </g>

  <g transform="translate(925 470)">
    <text class="label" x="60" y="0" text-anchor="middle">over → under</text>
    <text class="small" x="60" y="20" text-anchor="middle">mixed</text>
    <text class="small" x="10" y="45" text-anchor="middle">R1</text><text class="small" x="60" y="45" text-anchor="middle">R2</text><text class="small" x="110" y="45" text-anchor="middle">R3</text>
    <path class="wire" d="M 10 165 L 10 55 M 60 165 C 62 120 105 100 110 55 M 110 165 C 108 120 65 100 60 55"/>
    <text class="small" x="10" y="190" text-anchor="middle">L3</text><text class="small" x="60" y="190" text-anchor="middle">L2</text><text class="small" x="110" y="190" text-anchor="middle">L1</text>
    <text class="small" x="60" y="220" text-anchor="middle">1→2, 2→3, 3→1</text>
  </g>
</svg>
