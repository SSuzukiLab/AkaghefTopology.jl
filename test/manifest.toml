# Test manifest: every test file, the module it checks, and its tier.
#
# Tiers (see test/TESTING.md):
#   unit         small fixed examples of one module; run on every change to that module
#   integration  chains across modules on small examples; run before judging or committing
#   acceptance   corpus sweeps, random walks, census, campaigns; run once a day
#   manual       not run by any automatic tier (one-off campaigns, superseded files)
#
# A suite is one shared Julia module: its prelude is included once, then its selected
# files in the order listed here. Files of one suite may rely on the prelude only.
# Tiers marked "provisional" were assigned by name before any timing was measured;
# the first daily acceptance run records timings and they are reclassified from it.

[suites.top]
prelude = "prelude_top.jl"

[suites.heegaard]
prelude = "heegaard/prelude.jl"

