<text class="label" x="444.967" y="209.652" text-anchor="middle" dominant-baseline="middle">+3</text>
<circle class="endpoint under" cx="421.19" cy="328.623" r="7.0" stroke-width="2" aria-label="under passage at vertex 4"/>
