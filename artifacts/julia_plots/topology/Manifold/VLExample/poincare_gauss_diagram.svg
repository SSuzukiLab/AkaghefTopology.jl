<text class="label" x="370.496" y="438.848" text-anchor="middle" dominant-baseline="middle">+2</text>
<circle class="endpoint under" cx="250.0" cy="453.0" r="7.0" stroke-width="2" aria-label="under passage at vertex 3"/>
<text class="label" x="250.0" y="478.0" text-anchor="middle" dominant-baseline="middle">−3</text>
<circle class="endpoint over" cx="144.199" cy="418.623" r="7.0" stroke-width="2" aria-label="over passage at vertex 1"/>
<text class="label" x="129.504" y="438.848" text-anchor="middle" dominant-baseline="middle">+1</text>
